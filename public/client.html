<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script><script src="/common.js"></script>
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#1c2b33;--mu:#65676b;--bl:#0a78be;--bd:#dadde1;--gr:#31a24c;--rd:#e41e3f}
.dark{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#b0b3b8;--bd:#3e4042}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0a78be,#4fa3e0);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:16px;margin:0}header small{color:var(--mu)}.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px}
.wrap{display:flex;gap:16px;padding:16px;max-width:1400px;margin:auto}
aside{width:280px;flex:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;align-self:flex-start}
.node{padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:13px}.node:hover{background:rgba(10,120,190,.08)}.node.sel{background:#e7f3ff;color:var(--bl);font-weight:600}.dark .node.sel{background:#263951}
.l1{padding-left:20px}.l2{padding-left:36px}.ic{font-size:11px;color:var(--mu);width:56px;flex:none}
main{flex:1;min-width:0}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill{font-size:12px;border-radius:12px;padding:3px 9px;font-weight:600}.on{background:#e6f4ea;color:var(--gr)}.off{background:#f1f1f1;color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px}
.card .k{color:var(--mu);font-size:12px}.card .v{font-size:22px;font-weight:700;margin:6px 0 4px}.up{color:var(--gr);font-size:12px}.dn{color:var(--rd);font-size:12px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:10px}.tab{padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mu)}.tab.a{border-color:var(--bl);color:var(--bl);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;background:rgba(0,0,0,.02)}
.tw{overflow-x:auto}.tg{display:inline-block;flex:none;width:30px;height:16px;border-radius:9px;background:#bcc0c4;position:relative;vertical-align:middle}.tg.t{background:var(--bl)}.tg:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s}.tg.t:after{left:16px}
.vid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
input[type=date]{border:1px solid var(--bd);border-radius:6px;padding:6px;background:var(--card);color:var(--tx)}
.foot{color:var(--mu);font-size:11px;text-align:center;padding:16px}
@media(max-width:800px){.wrap{flex-direction:column;padding:10px}aside{width:100%}.card .v{font-size:18px}.cards{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="logo">A</div><div><h1>Ads Performance Dashboard</h1><small id="cn"></small></div><div class="sp"></div><button class="btn" onclick="document.body.classList.toggle('dark')">◐</button></header>
<div class="wrap"><aside id="tree"></aside><main>
<div class="bar"><b id="title"></b><span id="st"></span><div class="sp"></div>
<select class="btn" id="preset"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="max" selected>Maximum</option><option value="c">Custom</option></select>
<input type="date" id="from"><input type="date" id="to"></div>
<div class="cards" id="cards"></div>
<div class="panel"><div class="tabs" id="tabs"></div><div id="tabc"></div></div>
<div class="panel" id="vids"></div>
<div class="foot">Meta Ads data · Updated by your ads team · Figures may differ slightly from billing</div></main></div>
<script>
let C,sel=null,tab='Performance',chart;const tk=location.pathname.split('/').pop();
const allAds=()=>C.campaigns.flatMap(c=>c.adsets.flatMap(s=>s.ads.map(a=>({...a,_c:c,_s:s}))));
function scope(){if(!sel)return{name:'All campaigns',ads:allAds(),status:null};const[t,i]=sel;for(const c of C.campaigns){if(t=='c'&&c.id==i)return{name:c.name,ads:c.adsets.flatMap(s=>s.ads),status:c.status,lvl:'Campaign'};for(const s of c.adsets){if(t=='s'&&s.id==i)return{name:s.name,ads:s.ads,status:s.status,lvl:'Ad set'};for(const a of s.ads)if(t=='a'&&a.id==i)return{name:a.name,ads:[a],status:a.status,lvl:'Ad'}}}}
function tree(){let h=`<div class="node ${!sel?'sel':''}" onclick="pick(null)"><b>All campaigns</b></div>`;const st=s=>`<span class="tg ${s=='ACTIVE'?'t':''}"></span>`;
for(const c of C.campaigns){h+=`<div class="node ${sel&&sel[1]==c.id?'sel':''}" onclick="pick(['c','${c.id}'])">${st(c.status)}<span class="ic">Campaign</span>${esc(c.name)}</div>`;
for(const s of c.adsets){h+=`<div class="node l1 ${sel&&sel[1]==s.id?'sel':''}" onclick="pick(['s','${s.id}'])">${st(s.status)}<span class="ic">Ad set</span>${esc(s.name)}</div>`;
for(const a of s.ads)h+=`<div class="node l2 ${sel&&sel[1]==a.id?'sel':''}" onclick="pick(['a','${a.id}'])">${st(a.status)}<span class="ic">Ad</span>${esc(a.name)}</div>`}}tree_.innerHTML=h}
const tree_=document.getElementById('tree');
function pick(s){sel=s;render()}
function render(){tree();const S=scope(),f=from.value,t=to.value,n=(new Date(t)-new Date(f))/864e5+1;
const pf=ds(new Date(+new Date(f)-n*864e5)),pt=ds(new Date(+new Date(f)-864e5));const A=agg(S.ads,f,t),P=agg(S.ads,pf,pt);
title.textContent=S.name;st.innerHTML=S.status?` <span class="pill ${S.status=='ACTIVE'?'on':'off'}">${S.status=='ACTIVE'?'● Active':'Paused'}</span>`:'';
const ch=(k,inv)=>{if(!P[k])return'<span class="k" style="color:var(--mu);font-size:12px">— vs previous</span>';const p=(A[k]-P[k])/P[k]*100,good=inv?p<=0:p>=0;return`<span class="${good?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}% vs previous</span>`};
const M=[['Messaging conversations started',num(A.conv),'conv'],['Cost per conversation',inr(A.cpc),'cpc',1],['Amount spent',inr(A.spent),'spent'],['Leads / Inquiries',num(A.leads),'leads'],['Reach',num(A.reach),'reach'],['Impressions',num(A.impr),'impr'],['Link clicks',num(A.clicks),'clicks'],['CTR',A.ctr.toFixed(2)+'%','ctr'],['CPM',inr(A.cpm),'cpm',1]];
cards.innerHTML=M.map(m=>`<div class="card"><div class="k">${m[0]}</div><div class="v">${m[1]}</div>${ch(m[2],m[3])}</div>`).join('');
tabs.innerHTML=['Performance','Campaigns','Ad sets','Ads','Demographics','Platform'].map(x=>`<div class="tab ${x==tab?'a':''}" onclick="tab='${x}';render()">${x}</div>`).join('');
const row=(nm,st,ads,extra='')=>{const a=agg(ads,f,t);return`<tr><td><span class="tg ${st=='ACTIVE'?'t':''}"></span> ${esc(nm)}</td><td>${st=='ACTIVE'?'Active':'Paused'}</td>${extra}<td>${num(a.conv)}</td><td>${inr(a.cpc)}</td><td>${inr(a.spent)}</td><td>${num(a.leads)}</td><td>${num(a.reach)}</td><td>${num(a.impr)}</td><td>${num(a.clicks)}</td><td>${a.ctr.toFixed(2)}%</td><td>${inr(a.cpm)}</td></tr>`};
const hd=x=>`<div class="tw"><table><tr><th>Name</th><th>Delivery</th>${x||''}<th>Conversations</th><th>Cost/conv.</th><th>Spent</th><th>Leads</th><th>Reach</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPM</th></tr>`;
const bud=a=>a.budget?`${inr(a.budget)} ${a.budgetType=='lifetime'?'Lifetime':'Daily'}`:'—';
if(chart){chart.destroy();chart=null}
if(tab=='Performance'){tabc.innerHTML='<canvas id="cv" height="110"></canvas>';const days=[];for(let d=new Date(f);ds(d)<=t;d=new Date(+d+864e5))days.push(ds(d));
const dv=k=>days.map(d=>S.ads.reduce((s,a)=>s+(+((a.stats||{})[d]||{})[k]||0),0));
chart=new Chart(cv,{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'Conversations',data:dv('conv'),borderColor:'#0a78be',backgroundColor:'rgba(10,120,190,.12)',fill:true,tension:.35},{label:'Amount spent (₹)',data:dv('spent'),borderColor:'#7b61ff',tension:.35,yAxisID:'y1'}]},options:{interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true},y1:{position:'right',beginAtZero:true,grid:{display:false}}},animation:{duration:900}}})}
else if(tab=='Campaigns')tabc.innerHTML=hd()+C.campaigns.map(c=>row(c.name,c.status,c.adsets.flatMap(s=>s.ads))).join('')+'</table></div>';
else if(tab=='Ad sets')tabc.innerHTML=hd('<th>Budget</th>')+C.campaigns.flatMap(c=>c.adsets).map(s=>row(s.name,s.status,s.ads,`<td>${s.ads.map(bud).filter(x=>x!='—')[0]||'—'}</td>`)).join('')+'</table></div>';
else if(tab=='Ads')tabc.innerHTML=hd('<th>Budget</th><th>Video</th>')+allAds().map(a=>row(a.name,a.status,[a],`<td>${bud(a)}</td><td>${a.video?`<a href="${esc(a.video)}" target="_blank">Watch ▶</a>`:'—'}</td>`)).join('')+'</table></div>';
else{const D=C[tab=='Demographics'?'demographics':'platforms']||{};const ent=Object.entries(D);
tabc.innerHTML=ent.length?'<div class="tw"><table><tr><th>'+(tab=='Demographics'?'Age / Gender':'Platform')+'</th><th>Share of results</th><th></th></tr>'+ent.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}%</td><td style="width:50%"><div style="background:#e7f3ff;border-radius:4px"><div style="width:${v}%;background:#0a78be;height:10px;border-radius:4px"></div></div></td></tr>`).join('')+'</table></div>':'<p style="color:var(--mu)">No breakdown added yet.</p>'}
const V=S.ads.filter(a=>a.video);vids.style.display=V.length?'':'none';vids.innerHTML='<b>Ad creatives</b><div class="vid" style="margin-top:10px">'+V.map(a=>{const y=ytId(a.video);const pv=y?`<iframe src="https://www.youtube.com/embed/${y}" allowfullscreen></iframe>`:/\.(mp4|webm)(\?|$)/i.test(a.video)?`<video src="${esc(a.video)}" controls preload="metadata"></video>`:'';return`<div>${pv}<div style="margin-top:6px"><b>${esc(a.name)}</b> · <a href="${esc(a.video)}" target="_blank">Watch video ▶</a></div></div>`}).join('')+'</div>'}
function setPreset(){if(preset.value=="c")return;const t=new Date();to.value=ds(t);if(preset.value=="max"){const D=allAds().flatMap(a=>Object.keys(a.stats||{})).sort();from.value=D[0]||ds(t)}else from.value=ds(new Date(+t-(preset.value-1)*864e5));render()}
preset.onchange=setPreset;from.onchange=to.onchange=()=>{preset.value='c';render()};
fetch('/api/r/'+tk).then(r=>r.ok?r.json():Promise.reject()).then(d=>{C=d;cn.textContent=d.name;setPreset();setInterval(()=>fetch('/api/r/'+tk).then(r=>r.json()).then(d=>{C=d;render()}),60000)}).catch(()=>document.body.innerHTML='<h2 style="text-align:center;margin-top:20vh;font-family:sans-serif">This link is not active.</h2>');
</script></body></html>
