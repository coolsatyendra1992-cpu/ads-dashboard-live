<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads Performance Dashboard</title><script src="/common.js"></script>
<style>:root{--bg:#f0f2f5;--card:#fff;--tx:#1c2b33;--mu:#65676b;--bl:#0a78be;--bd:#dadde1;--gr:#31a24c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0a78be,#4fa3e0);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:16px;margin:0}header small{color:var(--mu)}
.wrap{max-width:900px;margin:auto;padding:14px}
.camp{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.ch b{font-size:15px}
.tg{display:inline-block;width:30px;height:16px;border-radius:9px;background:var(--bl);position:relative;flex:none}.tg:after{content:'';position:absolute;top:2px;left:16px;width:12px;height:12px;border-radius:50%;background:#fff}
.pill{font-size:12px;border-radius:12px;padding:3px 9px;font-weight:600;background:#e6f4ea;color:var(--gr)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid var(--bd);border-radius:8px;padding:12px}.k{color:var(--mu);font-size:12px}.v{font-size:21px;font-weight:700;margin:6px 0 4px;font-variant-numeric:tabular-nums}.s{color:var(--mu);font-size:11px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--gr);font-size:11px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:var(--gr);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.bar{height:6px;background:#e4e6eb;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.vid{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:8px}.vid a{margin-left:auto;background:var(--bl);color:#fff;text-decoration:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:40px}</style></head><body>
<header><div class="logo">A</div><div><h1>Ads Performance Dashboard</h1><small id="cn"></small></div></header>
<div class="wrap" id="w"></div>
<script>
let D,off=0;const tk=location.pathname.split('/').pop();
function draw(){const now=Date.now()+off;if(!D.campaigns.length){w.innerHTML='<div class="empty">No active campaigns right now.</div>';return}
w.innerHTML=D.campaigns.map(c=>{const u=planUsed(c,now),t=sumDays(c),rows=Object.entries(c.days||{}).sort().reverse().slice(0,7);
const cap=c.pkg?`<div class="bar"><i style="width:${Math.min(100,u/c.pkg*100)}%"></i></div><div class="s">of ${inr0(c.pkg)} package</div>`:`<div class="s">since ${c.start}</div>`;
return`<div class="camp"><div class="ch"><span class="tg"></span><b>${esc(c.name)}</b><span class="pill">● Active</span></div>
<div class="cards"><div class="card"><div class="k">Your plan</div><div class="v">${inr0(c.plan)}<span style="font-size:13px;font-weight:500">/day</span></div><div class="s">Started ${c.start}${c.end?' · ends '+c.end:''}</div></div>
<div class="card"><div class="k">${c.pkg?'Package used':'Plan used'} <span class="live"><span class="dot"></span>Live • auto-updating</span></div><div class="v" data-u="${c.id}">${inr(u)}</div>${cap}</div>
<div class="card"><div class="k">Leads</div><div class="v">${num(t.leads)}</div><div class="s">Total so far</div></div>
<div class="card"><div class="k">Reach</div><div class="v">${num(t.reach)}</div><div class="s">People reached</div></div></div>
${c.video?`<div class="vid">🎬 <span>Ad video</span><a href="${esc(c.video)}" target="_blank" rel="noopener">Watch video ▶</a></div>`:''}
${rows.length?`<table><tr><th>Date</th><th>Reach</th><th>Leads</th></tr>${rows.map(([d,v])=>`<tr><td>${d}</td><td>${num(+v.reach||0)}</td><td>${num(+v.leads||0)}</td></tr>`).join('')}</table>`:''}</div>`}).join('')}
function tick(){const now=Date.now()+off;for(const c of D.campaigns){const e=document.querySelector(`[data-u="${c.id}"]`);if(e)e.textContent=inr(planUsed(c,now))}}
function load(){return fetch('/api/r/'+tk).then(r=>r.ok?r.json():Promise.reject()).then(d=>{D=d;off=d.now-Date.now();cn.textContent=d.name;draw()})}
load().then(()=>{setInterval(tick,1000);setInterval(load,60000)}).catch(()=>document.body.innerHTML='<h2 style="text-align:center;margin-top:20vh;font-family:sans-serif">This link is not active.</h2>');
</script></body></html>
